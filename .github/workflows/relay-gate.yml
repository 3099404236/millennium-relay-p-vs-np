name: Millennium Relay Gate

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  python-verification-gate:
    name: Python Verification & Relay Gate (20 Suites + 24-Node DAG Audit)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python 3.12
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Run Deterministic Relay Gate (DAG, Artifacts, All Node Verification Scripts & Honesty Guard)
        run: python verification/validate_relay_gate.py

  lean4-kernel-gate:
    name: Lean 4.12 Kernel Verification (Baton #002 + #015 + #019)
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Install elan and build Lean 4 formalization
        working-directory: formal/lean4
        run: |
          curl -sSf https://raw.githubusercontent.com/leanprover/elan/master/elan-init.sh | sh -s -- -y --default-toolchain none
          echo "$HOME/.elan/bin" >> $GITHUB_PATH
          $HOME/.elan/bin/lake build
